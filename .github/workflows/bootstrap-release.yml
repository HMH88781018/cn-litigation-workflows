name: BOOTSTRAP_PAT safety validation

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: bootstrap-pat-safety-validation
  cancel-in-progress: false

jobs:
  validate-secret:
    if: github.repository == 'HMH88781018/cn-litigation-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Safely validate BOOTSTRAP_PAT
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          unset GH_DEBUG DEBUG || true

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::BOOTSTRAP_PAT is empty or unavailable."
            exit 1
          fi

          if [[ "${GH_TOKEN}" == *$'\n'* || "${GH_TOKEN}" == *$'\r'* ]]; then
            echo "::error::BOOTSTRAP_PAT contains a line break."
            exit 1
          fi

          if [[ "${GH_TOKEN}" =~ [[:space:]] ]]; then
            echo "::error::BOOTSTRAP_PAT contains whitespace."
            exit 1
          fi

          if [[ "${GH_TOKEN}" != github_pat_* ]]; then
            echo "::error::BOOTSTRAP_PAT has an invalid prefix."
            exit 1
          fi

          if ! authenticated_login="$(
            gh api --method GET user --jq '.login' 2>/dev/null
          )"; then
            echo "::error::GET /user rejected BOOTSTRAP_PAT."
            exit 1
          fi

          if [[ "${authenticated_login,,}" != "hmh88781018" ]]; then
            echo "::error::BOOTSTRAP_PAT authenticated as an unexpected account."
            exit 1
          fi

          echo "BOOTSTRAP_PAT validation passed for HMH88781018."
          echo "Publishing is intentionally disabled."
