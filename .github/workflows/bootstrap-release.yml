# Fresh classification run after correcting commit message
name: BOOTSTRAP_PAT no-disclosure classification

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-release.yml

permissions: {}

concurrency:
  group: bootstrap-pat-no-disclosure-classification
  cancel-in-progress: false

jobs:
  classify-secret:
    if: github.repository == 'HMH88781018/cn-litigation-workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify BOOTSTRAP_PAT without disclosure
        env:
          GH_TOKEN: ${{ secrets.BOOTSTRAP_PAT }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          unset GH_DEBUG DEBUG BASH_XTRACEFD PS4 || true

          fail_category() {
            printf '%s\n' "::error::BOOTSTRAP_PAT category: $1"
            printf '%s\n' "No secret content, length, hash, substring, or byte value was printed."
            printf '%s\n' "Publishing remains intentionally disabled."
            exit 1
          }

          if [[ -z "${GH_TOKEN:-}" ]]; then
            fail_category "EMPTY_OR_UNAVAILABLE"
          fi

          if [[ "${GH_TOKEN}" == \`* || "${GH_TOKEN}" == *\` ]]; then
            fail_category "BACKTICK_OR_CODE_WRAPPER"
          fi

          if [[ "${GH_TOKEN}" == \"* || "${GH_TOKEN}" == *\" ||
                "${GH_TOKEN}" == \'* || "${GH_TOKEN}" == *\' ]]; then
            fail_category "QUOTE_WRAPPER_OR_QUOTE_PREFIX"
          fi

          if [[ "${GH_TOKEN}" == *$'\n'* || "${GH_TOKEN}" == *$'\r'* ]]; then
            fail_category "CONTAINS_LINE_BREAK"
          fi

          if [[ "${GH_TOKEN}" =~ [[:space:]] ]]; then
            fail_category "CONTAINS_WHITESPACE"
          fi

          if [[ "${GH_TOKEN}" =~ ^[\*•●·]+$ ||
                "${GH_TOKEN,,}" == "redacted" ||
                "${GH_TOKEN,,}" == "[redacted]" ||
                "${GH_TOKEN,,}" == "<redacted>" ||
                "${GH_TOKEN,,}" == "masked" ||
                "${GH_TOKEN,,}" == "[masked]" ||
                "${GH_TOKEN,,}" == "<masked>" ]]; then
            fail_category "MASKED_PLACEHOLDER_COPIED_INSTEAD_OF_VALUE"
          fi

          case "${GH_TOKEN}" in
            BOOTSTRAP_PAT|bootstrap_pat|bootstrap-pat|secrets.BOOTSTRAP_PAT)
              fail_category "SECRET_NAME_COPIED_INSTEAD_OF_VALUE"
              ;;
            cn-litigation-bootstrap|cn-litigation-bootstrap-2)
              fail_category "TOKEN_DISPLAY_NAME_COPIED_INSTEAD_OF_VALUE"
              ;;
            http://*|https://*|github.com/*|www.github.com/*|api.github.com/*)
              fail_category "WEB_ADDRESS_COPIED_INSTEAD_OF_TOKEN"
              ;;
            ghp_*)
              fail_category "CLASSIC_PERSONAL_ACCESS_TOKEN_PREFIX"
              ;;
            gho_*|ghu_*|ghs_*|ghr_*)
              fail_category "OTHER_GITHUB_TOKEN_TYPE_PREFIX"
              ;;
            github_pat_*)
              fail_category "FINE_GRAINED_PREFIX_AT_START"
              ;;
            *github_pat_*)
              fail_category "EXTRA_LEADING_CONTENT_BEFORE_FINE_GRAINED_PREFIX"
              ;;
            github_pat*|github-pat*|githubpat*)
              fail_category "MALFORMED_FINE_GRAINED_PREFIX"
              ;;
            *)
              fail_category "OTHER_NON_TOKEN_CONTENT"
              ;;
          esac
